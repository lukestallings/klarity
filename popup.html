<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Klarity Analysis</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #ffffff;
      color: #1e293b;
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .logo-badge {
      width: 26px;
      height: 26px;
      background: #0284c7;
      color: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
    }
    .brand-name {
      font-size: 13px;
      font-weight: 500;
      color: #334155;
    }
    h1#headline {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.25;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .badge-bad { background: #fee2e2; color: #dc2626; }
    .badge-warn { background: #fef3c7; color: #d97706; }
    .badge-good { background: #dcfce7; color: #16a34a; }

    hr {
      border: none;
      border-top: 1.5px solid #0f172a;
      margin-bottom: 14px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .score-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .score-value {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }
    .bar-bg {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #dc2626;
      border-radius: 999px;
      transition: width 0.4s ease, background-color 0.3s ease;
    }

    /* Scanning animation classes */
    .bar-fill.is-loading {
      width: 100% !important;
      background: linear-gradient(90deg, #e2e8f0 0%, #3b82f6 50%, #e2e8f0 100%) !important;
      background-size: 200% 100% !important;
      animation: sweepScan 1s infinite linear !important;
    }

    @keyframes sweepScan {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
    .section-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #64748b;
      margin: 12px 0 8px 0;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 4px;
    }
    .signal-list {
      list-style: none;
      margin-bottom: 8px;
    }
    .signal-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: #1e293b;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .signal-icon {
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Corroborating Article Card Styles */
    .article-card {
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .article-card:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .article-card-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.25;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #2563eb;
      font-weight: 500;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 9px 0;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    #highlightBtn {
      background: #2563eb;
      color: #ffffff;
    }
    #highlightBtn:hover { background: #1d4ed8; }
    #reanalyzeBtn {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }
    #reanalyzeBtn:hover { background: #e2e8f0; }
  </style>
</head>
<body>
  <div class="brand-header">
    <div class="logo-badge">K</div>
    <span class="brand-name">Klarity Analysis</span>
  </div>

  <h1 id="headline">Scanning...</h1>
  <div id="riskBadge" class="status-badge badge-warn">ANALYZING</div>

  <hr>

  <div class="score-row">
    <span class="score-title">Credibility Score</span>
    <span id="scoreVal" class="score-value">--/100</span>
  </div>
  <div class="bar-bg">
    <div id="scoreBar" class="bar-fill"></div>
  </div>

  <div class="section-title">Domain & Site Signals</div>
  <ul id="domainSignals" class="signal-list">
    <li class="signal-item"><span class="signal-icon">⏳</span><span>Checking domain reputation...</span></li>
  </ul>

  <div class="section-title">Content Analysis</div>
  <ul id="contentSignals" class="signal-list">
    <li class="signal-item"><span class="signal-icon">⏳</span><span>Scanning text structure...</span></li>
  </ul>

  <div id="corroborationContainer" style="display: none; margin-top: 12px;">
    <div class="section-title">Related Coverage</div>
    <div id="articleLinksList" style="display: flex; flex-direction: column; gap: 6px;"></div>
  </div>

  <div class="btn-row">
    <button id="highlightBtn">Inspect Highlights</button>
    <button id="reanalyzeBtn">Re-Analyze</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
